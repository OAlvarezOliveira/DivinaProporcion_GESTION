# Base de datos local para DivinaProporcion_GESTION.
# Uso: docker compose up -d      (la primera vez crea la BD y ejecuta sql/schema.sql)
# Reiniciar desde cero: docker compose down -v && docker compose up -d
services:
  db:
    image: mariadb:11
    container_name: divinaproporcion-db
    environment:
      MARIADB_DATABASE: divinaProporcion
      MARIADB_USER: dp
      MARIADB_PASSWORD: dp_dev
      # contraseña de root aleatoria: la app solo usa el usuario dp
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
volumes:
  db-data:
